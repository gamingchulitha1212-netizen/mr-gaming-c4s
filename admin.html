<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mr Gaming C4S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg-void: #0D0402;
    --bg-deep: #1A0A05;
    --orange: #FF6B00;
    --red: #FF3D1A;
    --gold: #FFC700;
    --text-dim: #C9A896;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at 20% -10%, rgba(255,61,26,0.25), transparent 55%), var(--bg-void);
    font-family:'Rajdhani',sans-serif;
    color:#fff;
    padding:32px 16px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}
  h1{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    font-weight:800;
    background:linear-gradient(90deg,var(--gold),var(--orange) 60%,var(--red));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  .sub{color:var(--text-dim);font-size:14px;margin-bottom:26px;}
  .card{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,107,0,0.25);
    border-radius:14px;
    padding:20px;
    margin-bottom:16px;
  }
  label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  input[type=text], input[type=url], input[type=email], input[type=password]{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.35);
    color:#fff;
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    margin-bottom:14px;
  }
  input:focus{outline:none;border-color:var(--orange);}
  .row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .row input[type=checkbox]{width:18px;height:18px;}
  .row label{margin-bottom:0;text-transform:none;letter-spacing:0;font-size:14px;color:#fff;}
  .link-title{font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:1px;margin-bottom:14px;color:#fff;}
  button{
    font-family:'Orbitron',sans-serif;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:13px 18px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    width:100%;
  }
  .btn-primary{
    background:linear-gradient(90deg,var(--orange),var(--red));
    color:#fff;
    margin-top:6px;
  }
  .divider{
    display:flex;align-items:center;gap:10px;margin:16px 0;
    color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.15);}
  .btn-google{
    background:#fff;color:#1f1f1f;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;
    text-transform:none;letter-spacing:0;width:100%;
    padding:13px 18px;border-radius:10px;border:none;cursor:pointer;
  }
  .btn-google svg{width:18px;height:18px;}
  .btn-facebook{
    background:#1877F2;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;
    text-transform:none;letter-spacing:0;width:100%;
    padding:13px 18px;border-radius:10px;border:none;cursor:pointer;
    margin-top:10px;
  }
  .btn-facebook svg{width:18px;height:18px;}
  .btn-secondary{
    background:transparent;
    border:1px solid rgba(255,255,255,0.25);
    color:var(--text-dim);
    margin-top:10px;
  }
  #status{
    margin-top:14px;
    font-size:13px;
    color:var(--gold);
    min-height:18px;
  }
  #setupNotice{
    background:rgba(255,61,26,0.1);
    border:1px solid rgba(255,61,26,0.4);
    border-radius:10px;
    padding:16px;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
  }
  #setupNotice code{
    background:rgba(0,0,0,0.4);
    padding:1px 6px;
    border-radius:4px;
  }
  select{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.5);
    color:#fff;
    font-family:'Rajdhani',sans-serif;
    font-size:15px;
    margin-bottom:14px;
  }
  select:focus{outline:none;border-color:var(--orange);}
  .btn-add{
    background:transparent;
    border:1px dashed rgba(255,199,0,0.55);
    color:var(--gold);
    margin-bottom:16px;
  }
  .link-title{display:flex;align-items:center;justify-content:space-between;}
  .btn-delete{
    width:auto;
    padding:6px 12px;
    font-size:10px;
    background:rgba(255,61,26,0.15);
    border:1px solid rgba(255,61,26,0.5);
    color:#ff8a70;
  }
  .logo-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .logo-preview{
    width:72px;height:72px;flex-shrink:0;border-radius:50%;
    border:2px solid var(--gold);background:rgba(0,0,0,0.4) center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--text-dim);text-align:center;line-height:1.2;
  }
  .logo-preview.has-img span{display:none;}
  .logo-actions{flex:1;min-width:0;}
  .logo-actions input[type=file]{width:100%;font-size:12px;color:var(--text-dim);margin-bottom:0;}
  .logo-actions .btn-secondary{margin-top:8px;padding:8px 12px;font-size:10px;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Link Admin</h1>
    <p class="sub">Sign in to edit the site's links — no code needed.</p>

    <div id="setupNotice" class="hidden">
      Firebase isn't set up yet, so this panel can't sign in or save.
      Open <code>firebase-config.js</code> and fill in your Firebase project's
      values first.
    </div>

    <div id="loginCard" class="card">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <button class="btn-primary" id="loginBtn">Sign In</button>

      <div class="divider">or</div>

      <button class="btn-google" id="googleBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5c-2 1.4-4.6 2.2-7.6 2.2-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.5 35.8 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <button class="btn-facebook" id="facebookBtn">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.16 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33V22c4.78-.78 8.44-4.94 8.44-9.94z"/></svg>
        Continue with Facebook
      </button>

      <div id="status"></div>
    </div>

    <div id="editorCard" class="hidden">
      <div class="card">
        <div class="link-title">Site Settings</div>
        <label for="statusSelect">Status badge</label>
        <select id="statusSelect">
          <option value="online">Online Now</option>
          <option value="offline">Offline Now</option>
        </select>
        <label>Logo</label>
        <div class="logo-row">
          <div class="logo-preview" id="logoPreview"><span>Default logo</span></div>
          <div class="logo-actions">
            <input type="file" id="logoFile" accept="image/*">
            <button type="button" class="btn-secondary" id="logoResetBtn">Use default logo</button>
          </div>
        </div>
        <label for="posSelect">Support (donate) button position</label>
        <select id="posSelect">
          <option value="bottom-right">Bottom right</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-center">Bottom center</option>
          <option value="top-left">Top left</option>
        </select>
      </div>

      <div id="linkForms"></div>
      <div id="customForms"></div>
      <button type="button" class="btn-add" id="addLinkBtn">+ Add New Link</button>

      <button class="btn-primary" id="saveBtn">Save Changes</button>
      <button class="btn-secondary" id="logoutBtn">Sign Out</button>
      <div id="saveStatus"></div>
    </div>
  </div>

  <script>
    var LINK_META = [
      { key: 'instagram', name: 'Instagram', url: 'https://www.instagram.com/mr_gaming_c4s/' },
      { key: 'facebook', name: 'Facebook', url: 'https://www.facebook.com/chulitha.seniru.official/' },
      { key: 'tiktok', name: 'TikTok', url: 'https://www.tiktok.com/@mr_gaming_c4s' },
      { key: 'youtube', name: 'YouTube', url: 'https://www.youtube.com/@mrgamingc4s' },
      { key: 'discord', name: 'Discord', url: 'https://discord.gg/evhjT6dEa' },
      { key: 'telegram', name: 'Telegram', url: 'https://t.me/mrgamingc4s' },
      { key: 'whatsapp', name: 'WhatsApp Channel', url: 'https://whatsapp.com/channel/0029VbDGbEyEVccOHan2wm40' }
    ];

    var hasFirebase = (typeof firebaseConfig !== 'undefined') &&
      firebaseConfig.databaseURL &&
      firebaseConfig.databaseURL.indexOf('YOUR_PROJECT') === -1;

    if (!hasFirebase) {
      document.getElementById('setupNotice').classList.remove('hidden');
      document.getElementById('loginBtn').disabled = true;
    } else {
      firebase.initializeApp(firebaseConfig);
    }

    var ADMIN_UID = "hSOy0TXxafQFsEGZZleIpgIVKVx1";
    // Email-based admins must also have a verified email (e.g. signed in with Google).
    var ADMIN_EMAILS = ["chulitharv123@gmail.com", "gamingchulitha1212@gmail.com"];
    function isAdminUser(user) {
      if (!user) return false;
      if (user.uid === ADMIN_UID) return true;
      return !!(user.emailVerified && user.email && ADMIN_EMAILS.indexOf(user.email.toLowerCase()) !== -1);
    }

    var loginBtn = document.getElementById('loginBtn');
    var logoutBtn = document.getElementById('logoutBtn');
    var saveBtn = document.getElementById('saveBtn');
    var statusEl = document.getElementById('status');
    var saveStatusEl = document.getElementById('saveStatus');
    var loginCard = document.getElementById('loginCard');
    var editorCard = document.getElementById('editorCard');
    var linkForms = document.getElementById('linkForms');

    if (hasFirebase) {
      loginBtn.addEventListener('click', function () {
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;
        statusEl.textContent = 'Signing in...';
        firebase.auth().signInWithEmailAndPassword(email, pass)
          .catch(function (err) {
            statusEl.textContent = err.message;
          });
      });

      document.getElementById('googleBtn').addEventListener('click', function () {
        statusEl.textContent = 'Opening Google sign-in...';
        firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
          .catch(function (err) { statusEl.textContent = err.message; });
      });

      document.getElementById('facebookBtn').addEventListener('click', function () {
        statusEl.textContent = 'Opening Facebook sign-in...';
        firebase.auth().signInWithPopup(new firebase.auth.FacebookAuthProvider())
          .catch(function (err) { statusEl.textContent = err.message; });
      });

      logoutBtn.addEventListener('click', function () {
        firebase.auth().signOut();
      });

      firebase.auth().onAuthStateChanged(function (user) {
        if (user) {
          if (isAdminUser(user)) {
            loginCard.classList.add('hidden');
            editorCard.classList.remove('hidden');
            loadLinks();
          } else {
            // Signed in, but not the admin account — kick them back out.
            statusEl.textContent = 'This account isn\'t authorized for admin access.';
            firebase.auth().signOut();
          }
        } else {
          loginCard.classList.remove('hidden');
          editorCard.classList.add('hidden');
        }
      });

      var SITE_URL = 'https://mr-gaming-c4s.vercel.app/';
      var customForms = document.getElementById('customForms');
      // ----- logo: stored as a small square image inside the database -----
      var currentLogo = '';
      var logoPreview = document.getElementById('logoPreview');
      function showLogo(dataUrl) {
        currentLogo = dataUrl || '';
        if (currentLogo) {
          logoPreview.style.backgroundImage = 'url("' + currentLogo + '")';
          logoPreview.classList.add('has-img');
        } else {
          logoPreview.style.backgroundImage = '';
          logoPreview.classList.remove('has-img');
        }
      }
      function resizeLogo(file, size, done, fail) {
        var reader = new FileReader();
        reader.onerror = fail;
        reader.onload = function () {
          var img = new Image();
          img.onerror = fail;
          img.onload = function () {
            var c = document.createElement('canvas');
            c.width = c.height = size;
            var ctx = c.getContext('2d');
            ctx.fillStyle = '#1A0A05';
            ctx.fillRect(0, 0, size, size);
            var s = Math.min(img.width, img.height);
            ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
            done(c.toDataURL('image/jpeg', 0.88));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      }
      document.getElementById('logoFile').addEventListener('change', function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        if (f.type.indexOf('image/') !== 0) { saveStatusEl.textContent = 'Please choose an image file.'; return; }
        if (f.size > 8 * 1024 * 1024) { saveStatusEl.textContent = 'That image is too large (max 8 MB).'; return; }
        resizeLogo(f, 300, function (dataUrl) {
          showLogo(dataUrl);
          saveStatusEl.textContent = 'Logo ready. Press Save Changes to apply it.';
        }, function () { saveStatusEl.textContent = 'Could not read that image.'; });
      });
      document.getElementById('logoResetBtn').addEventListener('click', function () {
        showLogo('');
        document.getElementById('logoFile').value = '';
        saveStatusEl.textContent = 'Default logo selected. Press Save Changes to apply it.';
      });
      var URL_OK = /^https?:\/\//i;

      function esc(v) {
        var d = document.createElement('div');
        d.textContent = v == null ? '' : String(v);
        return d.innerHTML.replace(/"/g, '&quot;');
      }

      function customCardHtml(id, d) {
        return (
          '<div class="card custom-card" data-id="' + esc(id) + '" data-created="' + esc(d.created || Date.now()) + '">' +
            '<div class="link-title"><span>Custom Link</span>' +
              '<button type="button" class="btn-delete">Delete</button></div>' +
            '<label>Label (button text)</label>' +
            '<input type="text" class="cl-label" placeholder="e.g. My Website" value="' + esc(d.label) + '">' +
            '<label>URL</label>' +
            '<input type="url" class="cl-url" placeholder="https://..." value="' + esc(d.url) + '">' +
            '<div class="row">' +
              '<input type="checkbox" class="cl-enabled"' + (d.enabled === false ? '' : ' checked') + '>' +
              '<label>Show this button on the site</label>' +
            '</div>' +
          '</div>'
        );
      }

      document.getElementById('addLinkBtn').addEventListener('click', function () {
        var id = 'custom_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        customForms.insertAdjacentHTML('beforeend', customCardHtml(id, { label: '', url: '', enabled: true, created: Date.now() }));
        var cards = customForms.querySelectorAll('.custom-card');
        cards[cards.length - 1].querySelector('.cl-label').focus();
      });

      customForms.addEventListener('click', function (e) {
        if (e.target.classList.contains('btn-delete')) {
          var card = e.target.closest('.custom-card');
          if (card) card.remove();
        }
      });

      function loadLinks() {
        linkForms.innerHTML = LINK_META.map(function (m) {
          return (
            '<div class="card">' +
              '<div class="link-title">' + m.name + '</div>' +
              '<label>Label (button text)</label>' +
              '<input type="text" id="label-' + m.key + '" placeholder="' + m.name + '">' +
              '<label>URL</label>' +
              '<input type="url" id="url-' + m.key + '" placeholder="https://...">' +
              '<div class="row">' +
                '<input type="checkbox" id="enabled-' + m.key + '" checked>' +
                '<label for="enabled-' + m.key + '">Show this button on the site</label>' +
              '</div>' +
            '</div>'
          );
        }).join('');
        customForms.innerHTML = '';

        firebase.database().ref('links').once('value').then(function (snap) {
          var data = snap.val() || {};
          LINK_META.forEach(function (m) {
            var d = data[m.key] || {};
            document.getElementById('label-' + m.key).value = d.label || m.name;
            document.getElementById('url-' + m.key).value = d.url || m.url;
            document.getElementById('enabled-' + m.key).checked = (d.enabled !== false);
          });

          var builtIn = LINK_META.map(function (m) { return m.key; });
          Object.keys(data)
            .filter(function (k) { return builtIn.indexOf(k) === -1 && data[k] && data[k].custom === true; })
            .sort(function (x, y) { return (data[x].created || 0) - (data[y].created || 0); })
            .forEach(function (k) {
              customForms.insertAdjacentHTML('beforeend', customCardHtml(k, data[k]));
            });
        }).catch(function (err) {
          saveStatusEl.textContent = 'Could not load links: ' + err.message;
        });

        firebase.database().ref('settings').once('value').then(function (snap) {
          var st = snap.val() || {};
          document.getElementById('statusSelect').value = (st.status === 'offline') ? 'offline' : 'online';
          showLogo(typeof st.logo === 'string' && st.logo.indexOf('data:image/') === 0 ? st.logo : '');
          var pos = st.donatePosition;
          if (['bottom-right', 'bottom-left', 'bottom-center', 'top-left'].indexOf(pos) !== -1) {
            document.getElementById('posSelect').value = pos;
          }
        }).catch(function () { /* defaults stay selected */ });
      }

      saveBtn.addEventListener('click', function () {
        var links = {};
        var problem = null;

        LINK_META.forEach(function (m) {
          var label = document.getElementById('label-' + m.key).value.trim();
          var url = document.getElementById('url-' + m.key).value.trim();
          if (url && !URL_OK.test(url)) problem = problem || (m.name + ': the URL must start with https://');
          links[m.key] = {
            label: label,
            url: url,
            enabled: document.getElementById('enabled-' + m.key).checked
          };
        });

        customForms.querySelectorAll('.custom-card').forEach(function (card) {
          var label = card.querySelector('.cl-label').value.trim();
          var url = card.querySelector('.cl-url').value.trim();
          if (!label && !url) return; // empty card: ignore
          if (!label || !url) { problem = problem || 'Every custom link needs both a label and a URL.'; return; }
          if (!URL_OK.test(url)) { problem = problem || ('"' + label + '": the URL must start with https://'); return; }
          links[card.getAttribute('data-id')] = {
            label: label,
            url: url,
            enabled: card.querySelector('.cl-enabled').checked,
            custom: true,
            created: Number(card.getAttribute('data-created')) || Date.now()
          };
        });

        if (problem) { saveStatusEl.textContent = problem; return; }

        var settings = {
          status: document.getElementById('statusSelect').value,
          donatePosition: document.getElementById('posSelect').value
        };
        if (currentLogo) settings.logo = currentLogo;

        saveStatusEl.textContent = 'Saving...';
        saveBtn.disabled = true;

        firebase.database().ref('links').set(links)
          .then(function () {
            return firebase.database().ref('settings').set(settings).catch(function (err) {
              throw new Error('Links were saved, but the settings were not (' + err.message + '). Add a "settings" section to your database rules, then save again.');
            });
          })
          .then(function () {
            saveStatusEl.textContent = 'Saved! Going to the home page...';
            window.location.href = SITE_URL;
          })
          .catch(function (err) {
            saveBtn.disabled = false;
            saveStatusEl.textContent = (err.message.indexOf('Links were saved') === 0) ? err.message : ('Error: ' + err.message);
          });
      });
    }
  </script>
</body>
</html>
