<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Mr Gaming C4S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg-void: #0D0402;
    --bg-deep: #1A0A05;
    --orange: #FF6B00;
    --red: #FF3D1A;
    --gold: #FFC700;
    --text-dim: #C9A896;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background: radial-gradient(ellipse at 20% -10%, rgba(255,61,26,0.25), transparent 55%), var(--bg-void);
    font-family:'Rajdhani',sans-serif;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .wrap{width:100%;max-width:380px;}
  h1{
    font-family:'Orbitron',sans-serif;
    font-size:22px;
    font-weight:800;
    text-align:center;
    background:linear-gradient(90deg,var(--gold),var(--orange) 60%,var(--red));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:6px;
  }
  .sub{color:var(--text-dim);font-size:14px;margin-bottom:22px;text-align:center;}
  .back{
    display:block;text-align:center;color:var(--text-dim);
    font-size:13px;margin-bottom:18px;text-decoration:none;
  }
  .back:hover{color:var(--gold);}
  .card{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,107,0,0.25);
    border-radius:14px;
    padding:22px;
  }
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{
    flex:1;text-align:center;padding:9px;border-radius:8px;
    font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;cursor:pointer;
    border:1px solid rgba(255,255,255,0.15);color:var(--text-dim);
  }
  .tab.active{
    background:linear-gradient(90deg,var(--orange),var(--red));
    color:#fff;border-color:transparent;
  }
  label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  input[type=text], input[type=email], input[type=password]{
    width:100%;padding:11px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.35);color:#fff;
    font-family:'Rajdhani',sans-serif;font-size:15px;margin-bottom:14px;
  }
  input:focus{outline:none;border-color:var(--orange);}
  button{
    font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;padding:13px 18px;border-radius:10px;
    border:none;cursor:pointer;width:100%;
  }
  .btn-primary{background:linear-gradient(90deg,var(--orange),var(--red));color:#fff;}
  .divider{
    display:flex;align-items:center;gap:10px;margin:18px 0;
    color:var(--text-dim);font-size:12px;text-transform:uppercase;letter-spacing:1px;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.15);}
  .btn-google{
    background:#fff;color:#1f1f1f;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;
    text-transform:none;letter-spacing:0;
  }
  .btn-google svg{width:18px;height:18px;}
  .btn-facebook{
    background:#1877F2;color:#fff;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14.5px;
    text-transform:none;letter-spacing:0;
    margin-top:10px;
  }
  .btn-facebook svg{width:18px;height:18px;}
  #authStatus{margin-top:14px;font-size:13px;color:var(--gold);min-height:18px;text-align:center;}
  #setupNotice{
    background:rgba(255,61,26,0.1);border:1px solid rgba(255,61,26,0.4);
    border-radius:10px;padding:16px;font-size:14px;line-height:1.5;margin-bottom:18px;
  }
  #setupNotice code{background:rgba(0,0,0,0.4);padding:1px 6px;border-radius:4px;}
  .hidden{display:none;}

  .profile-card{text-align:center;}
  .avatar{
    width:72px;height:72px;border-radius:50%;margin:0 auto 14px;
    object-fit:cover;border:2px solid var(--gold);
  }
  .profile-name{font-family:'Orbitron',sans-serif;font-size:16px;margin-bottom:4px;}
  .profile-email{color:var(--text-dim);font-size:13.5px;margin-bottom:18px;}
  .owner-badge{
    display:inline-block;margin-bottom:16px;padding:5px 12px;border-radius:20px;
    background:rgba(255,199,0,0.12);border:1px solid rgba(255,199,0,0.4);
    color:var(--gold);font-size:11.5px;letter-spacing:1px;text-transform:uppercase;
    font-family:'Orbitron',sans-serif;
  }
  .btn-admin{
    display:block;background:linear-gradient(90deg,var(--gold),var(--orange));
    color:#1a0a05;text-decoration:none;padding:13px 18px;border-radius:10px;
    font-family:'Orbitron',sans-serif;font-size:13px;letter-spacing:1px;
    text-transform:uppercase;margin-bottom:10px;
  }
  .btn-secondary{
    background:transparent;border:1px solid rgba(255,255,255,0.25);
    color:var(--text-dim);
  }
</style>
</head>
<body>
  <div class="wrap">
    <a href="https://mr-gaming-c4s.vercel.app/" class="back">← Back to site</a>
    <h1>Mr Gaming C4S</h1>
    <p class="sub">Sign in to your account</p>

    <div id="setupNotice" class="hidden">
      Firebase isn't set up yet, so login can't work. Open
      <code>firebase-config.js</code> and fill in your Firebase project's
      values, then enable Email/Password and Google sign-in methods in the
      Firebase console.
    </div>

    <div id="authCard" class="card hidden">
      <div class="tabs">
        <div class="tab active" id="tabLogin">Login</div>
        <div class="tab" id="tabSignup">Sign Up</div>
      </div>

      <div id="nameField" class="hidden">
        <label for="name">Display Name</label>
        <input type="text" id="name" autocomplete="name">
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">

      <button class="btn-primary" id="submitBtn">Login</button>

      <div class="divider">or</div>

      <button class="btn-google" id="googleBtn">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5c-2 1.4-4.6 2.2-7.6 2.2-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.5 35.8 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Continue with Google
      </button>

      <button class="btn-facebook" id="facebookBtn">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.16 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.9h-2.33V22c4.78-.78 8.44-4.94 8.44-9.94z"/></svg>
        Continue with Facebook
      </button>

      <div id="authStatus"></div>
    </div>

    <div id="profileCard" class="card profile-card hidden">
      <img id="avatar" class="avatar hidden" alt="">
      <div id="profileName" class="profile-name"></div>
      <div id="profileEmail" class="profile-email"></div>
      <div id="ownerBadge" class="owner-badge hidden">⭐ Site Owner</div>
      <a id="adminLink" href="admin.html" class="btn-admin hidden">Open Admin Panel</a>
      <button class="btn-secondary" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <script>
    // Only this email is treated as the site owner/admin. Any other
    // account that logs in is just a regular visitor.
    var ADMIN_EMAIL = "chulitharv123@gmail.com";

    var hasFirebase = (typeof firebaseConfig !== 'undefined') &&
      firebaseConfig.databaseURL &&
      firebaseConfig.databaseURL.indexOf('YOUR_PROJECT') === -1;

    var authCard = document.getElementById('authCard');
    var profileCard = document.getElementById('profileCard');
    var statusEl = document.getElementById('authStatus');

    if (!hasFirebase) {
      document.getElementById('setupNotice').classList.remove('hidden');
    } else {
      firebase.initializeApp(firebaseConfig);
      authCard.classList.remove('hidden');

      var mode = 'login'; // or 'signup'
      var tabLogin = document.getElementById('tabLogin');
      var tabSignup = document.getElementById('tabSignup');
      var nameField = document.getElementById('nameField');
      var submitBtn = document.getElementById('submitBtn');

      function setMode(m) {
        mode = m;
        tabLogin.classList.toggle('active', m === 'login');
        tabSignup.classList.toggle('active', m === 'signup');
        nameField.classList.toggle('hidden', m !== 'signup');
        submitBtn.textContent = m === 'signup' ? 'Create Account' : 'Login';
        statusEl.textContent = '';
      }
      tabLogin.addEventListener('click', function () { setMode('login'); });
      tabSignup.addEventListener('click', function () { setMode('signup'); });

      var SITE_URL = 'mr-gaming-c4s.html';

      submitBtn.addEventListener('click', function () {
        var email = document.getElementById('email').value.trim();
        var pass = document.getElementById('password').value;
        var name = document.getElementById('name').value.trim();

        if (!email || !pass) {
          statusEl.textContent = 'Please fill in email and password.';
          return;
        }

        statusEl.textContent = 'Please wait...';

        if (mode === 'signup') {
          firebase.auth().createUserWithEmailAndPassword(email, pass)
            .then(function (cred) {
              if (name) {
                return cred.user.updateProfile({ displayName: name });
              }
            })
            .then(function () { window.location.href = SITE_URL; })
            .catch(function (err) { statusEl.textContent = err.message; });
        } else {
          firebase.auth().signInWithEmailAndPassword(email, pass)
            .then(function () { window.location.href = SITE_URL; })
            .catch(function (err) { statusEl.textContent = err.message; });
        }
      });

      document.getElementById('googleBtn').addEventListener('click', function () {
        var provider = new firebase.auth.GoogleAuthProvider();
        statusEl.textContent = 'Opening Google sign-in...';
        firebase.auth().signInWithPopup(provider)
          .then(function () { window.location.href = SITE_URL; })
          .catch(function (err) { statusEl.textContent = err.message; });
      });

      document.getElementById('facebookBtn').addEventListener('click', function () {
        var provider = new firebase.auth.FacebookAuthProvider();
        statusEl.textContent = 'Opening Facebook sign-in...';
        firebase.auth().signInWithPopup(provider)
          .then(function () { window.location.href = SITE_URL; })
          .catch(function (err) { statusEl.textContent = err.message; });
      });

      document.getElementById('logoutBtn').addEventListener('click', function () {
        firebase.auth().signOut();
      });

      firebase.auth().onAuthStateChanged(function (user) {
        if (user) {
          authCard.classList.add('hidden');
          profileCard.classList.remove('hidden');

          document.getElementById('profileName').textContent = user.displayName || 'Player';
          document.getElementById('profileEmail').textContent = user.email || '';

          var avatar = document.getElementById('avatar');
          if (user.photoURL) {
            avatar.src = user.photoURL;
            avatar.classList.remove('hidden');
          } else {
            avatar.classList.add('hidden');
          }

          var isOwner = user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
          document.getElementById('ownerBadge').classList.toggle('hidden', !isOwner);
          document.getElementById('adminLink').classList.toggle('hidden', !isOwner);

          statusEl.textContent = 'Signed in! Taking you back to the site...';
          setTimeout(function () {
            window.location.href = 'https://mr-gaming-c4s.vercel.app/';
          }, 900);
        } else {
          authCard.classList.remove('hidden');
          profileCard.classList.add('hidden');
        }
      });
    }
  </script>
</body>
</html>
