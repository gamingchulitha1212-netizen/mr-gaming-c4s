<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Users - Mr Gaming C4S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --bg-void:#0D0402; --orange:#FF6B00; --red:#FF3D1A; --gold:#FFC700; --text-dim:#C9A896;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at 20% -10%, rgba(255,61,26,0.25), transparent 55%), var(--bg-void);
    font-family:'Rajdhani',sans-serif;
    color:#fff;
    padding:32px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}
  h1{
    font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;
    background:linear-gradient(90deg,var(--gold),var(--orange) 60%,var(--red));
    -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;
  }
  .sub{color:var(--text-dim);font-size:14px;margin-bottom:14px;}
  .nav{display:flex;gap:16px;margin-bottom:20px;font-size:13px;}
  .nav a{color:var(--gold);text-decoration:none;}
  .nav a:hover{text-decoration:underline;}
  .card{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,107,0,0.25);
    border-radius:14px;padding:18px;margin-bottom:14px;
  }
  .hidden{display:none;}
  .notice{font-size:14px;line-height:1.5;}
  .notice a{color:var(--gold);}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .bar input{
    flex:1;min-width:0;padding:10px 12px;border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.35);color:#fff;
    font-family:'Rajdhani',sans-serif;font-size:15px;
  }
  .bar input:focus{outline:none;border-color:var(--orange);}
  .bar button{
    font-family:'Orbitron',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;
    padding:11px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.25);
    background:transparent;color:var(--text-dim);cursor:pointer;
  }
  .count{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:1px;color:var(--gold);margin-bottom:12px;}
  .user{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 0;border-top:1px solid rgba(255,255,255,0.08);
  }
  .user:first-child{border-top:none;}
  .avatar{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;object-fit:cover;
    border:1px solid var(--gold);background:rgba(255,199,0,0.1);
    display:flex;align-items:center;justify-content:center;
    font-family:'Orbitron',sans-serif;font-size:16px;color:var(--gold);
  }
  .info{min-width:0;flex:1;}
  .name{font-weight:700;font-size:16px;word-break:break-word;}
  .email{color:var(--text-dim);font-size:13.5px;word-break:break-all;}
  .meta{margin-top:4px;font-size:12px;color:#9a8b82;line-height:1.5;}
  .tag{
    display:inline-block;margin-right:6px;padding:1px 8px;border-radius:10px;
    border:1px solid rgba(255,199,0,0.4);color:var(--gold);font-size:11px;
  }
  .empty{color:var(--text-dim);font-size:14px;padding:6px 0;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Logged-in Users</h1>
    <p class="sub">Everyone who has signed in to the site.</p>
    <div class="nav">
      <a href="admin.html">← Admin Panel</a>
      <a href="index.html">Site</a>
    </div>

    <div id="setupNotice" class="card notice hidden">
      Firebase isn't set up yet. Fill in <code>firebase-config.js</code> first.
    </div>

    <div id="gate" class="card notice">Checking your sign-in...</div>

    <div id="listCard" class="card hidden">
      <div class="bar">
        <input type="text" id="search" placeholder="Search by name or email">
        <button type="button" id="refreshBtn">Refresh</button>
      </div>
      <div class="count" id="count"></div>
      <div id="list"></div>
    </div>
  </div>

  <script>
    var ADMIN_UID = "hSOy0TXxafQFsEGZZleIpgIVKVx1";
    var ADMIN_EMAILS = ["chulitharv123@gmail.com", "gamingchulitha1212@gmail.com"];
    function isAdminUser(user) {
      if (!user) return false;
      if (user.uid === ADMIN_UID) return true;
      return !!(user.emailVerified && user.email && ADMIN_EMAILS.indexOf(user.email.toLowerCase()) !== -1);
    }

    var hasFirebase = (typeof firebaseConfig !== 'undefined') &&
      firebaseConfig.databaseURL &&
      firebaseConfig.databaseURL.indexOf('YOUR_PROJECT') === -1;

    var gate = document.getElementById('gate');
    var listCard = document.getElementById('listCard');
    var listEl = document.getElementById('list');
    var countEl = document.getElementById('count');
    var searchEl = document.getElementById('search');
    var allUsers = [];

    var PROVIDERS = { 'google.com': 'Google', 'facebook.com': 'Facebook', 'password': 'Email' };

    function fmt(ms) {
      if (!ms) return '-';
      var d = new Date(ms);
      return isNaN(d.getTime()) ? '-' : d.toLocaleString();
    }

    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }

    function render() {
      var q = searchEl.value.trim().toLowerCase();
      var shown = allUsers.filter(function (u) {
        if (!q) return true;
        return (u.name || '').toLowerCase().indexOf(q) !== -1 ||
               (u.email || '').toLowerCase().indexOf(q) !== -1;
      });

      countEl.textContent = shown.length + (q ? ' of ' + allUsers.length : '') + (allUsers.length === 1 ? ' user' : ' users');
      listEl.innerHTML = '';

      if (!shown.length) {
        listEl.appendChild(el('div', 'empty', allUsers.length ? 'No one matches that search.' : 'No one has logged in yet.'));
        return;
      }

      shown.forEach(function (u) {
        var row = el('div', 'user');

        var av;
        if (typeof u.photo === 'string' && /^https:\/\//i.test(u.photo)) {
          av = document.createElement('img');
          av.className = 'avatar';
          av.alt = '';
          av.referrerPolicy = 'no-referrer';
          av.src = u.photo;
        } else {
          av = el('div', 'avatar', ((u.name || u.email || '?').trim().charAt(0) || '?').toUpperCase());
        }
        row.appendChild(av);

        var info = el('div', 'info');
        info.appendChild(el('div', 'name', u.name || '(no name)'));
        info.appendChild(el('div', 'email', u.email || '(no email)'));

        var meta = el('div', 'meta');
        meta.appendChild(el('span', 'tag', PROVIDERS[u.provider] || u.provider || 'Unknown'));
        meta.appendChild(document.createTextNode(
          'First login: ' + fmt(u.createdAt) + '  |  Last login: ' + fmt(u.lastLogin) +
          '  |  Sessions: ' + (u.logins || 1)
        ));
        info.appendChild(meta);

        row.appendChild(info);
        listEl.appendChild(row);
      });
    }

    function loadUsers() {
      countEl.textContent = 'Loading...';
      firebase.database().ref('users').once('value').then(function (snap) {
        var data = snap.val() || {};
        allUsers = Object.keys(data).map(function (uid) {
          var u = data[uid] || {};
          u.uid = uid;
          return u;
        }).sort(function (a, b) { return (b.lastLogin || 0) - (a.lastLogin || 0); });
        render();
      }).catch(function (err) {
        countEl.textContent = '';
        listEl.innerHTML = '';
        listEl.appendChild(el('div', 'empty', 'Could not load users: ' + err.message +
          ' (Make sure the "users" section is added to your database rules.)'));
      });
    }

    function showGate(html) {
      listCard.classList.add('hidden');
      gate.classList.remove('hidden');
      gate.innerHTML = html;
    }

    if (!hasFirebase) {
      gate.classList.add('hidden');
      document.getElementById('setupNotice').classList.remove('hidden');
    } else {
      firebase.initializeApp(firebaseConfig);
      searchEl.addEventListener('input', render);
      document.getElementById('refreshBtn').addEventListener('click', loadUsers);

      firebase.auth().onAuthStateChanged(function (user) {
        if (!user) {
          showGate('Please <a href="login.html">log in</a> with the admin account, then open this page again.');
        } else if (!isAdminUser(user)) {
          showGate('This account isn\'t authorized to view the users list.');
        } else {
          gate.classList.add('hidden');
          listCard.classList.remove('hidden');
          loadUsers();
        }
      });
    }
  </script>
</body>
</html>
