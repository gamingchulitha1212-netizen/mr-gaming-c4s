<style>
  :root{
    --bg-void: #0D0402;
    --bg-deep: #1A0A05;
    --orange: #FF6B00;
    --red: #FF3D1A;
    --gold: #FFC700;
    --ember: #FF1E56;
    --text-dim: #C9A896;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(255,61,26,0.35), transparent 55%),
      radial-gradient(ellipse at 85% 110%, rgba(255,199,0,0.18), transparent 50%),
      var(--bg-void);
    font-family:'Rajdhani',sans-serif;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    overflow-x:hidden;
    position:relative;
  }

  html.has-custom-cursor, html.has-custom-cursor a, html.has-custom-cursor button, html.has-custom-cursor .link-btn{
    cursor:none;
  }

  #customCursor{
    position:fixed;
    top:0;
    left:0;
    width:28px;
    height:36px;
    pointer-events:none;
    z-index:9999;
    opacity:0;
    transition:opacity .15s ease;
    transform:translate(-100px,-100px);
    will-change:transform;
    animation:cursorHue 2.4s linear infinite;
    filter:drop-shadow(0 0 4px rgba(255,107,0,0.5));
  }
  #customCursor img{width:100%;height:100%;display:block;}
  @keyframes cursorHue{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}
  }

  /* scanline / grid HUD texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,107,0,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,0,0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events:none;
    mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 75%);
    z-index:0;
  }

  #embers{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    text-align:center;
  }

  /* Logo badge */
  .badge{
    width:132px;
    height:132px;
    margin:0 auto 22px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: conic-gradient(from 180deg, var(--gold), var(--orange), var(--red), var(--ember), var(--gold));
    padding:3px;
    position:relative;
    animation: spin 8s linear infinite, badgeGlow 3s ease-in-out infinite;
  }
  .badge::before,
  .badge::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:2px solid rgba(255,150,30,0.55);
    animation: ringPulse 2.6s ease-out infinite;
    pointer-events:none;
  }
  .badge::after{
    animation-delay:1.3s;
    border-color:rgba(255,199,0,0.45);
  }
  @keyframes badgeGlow{
    0%,100%{ box-shadow: 0 0 30px rgba(255,107,0,0.3); }
    50%{ box-shadow: 0 0 55px rgba(255,150,30,0.55); }
  }
  @keyframes ringPulse{
    0%{ transform:scale(1); opacity:0.85; }
    100%{ transform:scale(1.85); opacity:0; }
  }
  .badge-inner{
    width:100%;
    height:100%;
    border-radius:50%;
    background: var(--bg-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: spin-rev 8s linear infinite;
    overflow:hidden;
  }
  .badge-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes spin-rev{to{transform:rotate(-360deg);}}

  .eyebrow{
    font-family:'Orbitron',sans-serif;
    font-size:11px;
    letter-spacing:5px;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:10px;
  }

  h1{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(28px,7vw,38px);
    line-height:1.15;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--gold),var(--orange) 55%,var(--red));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 34px rgba(255,107,0,0.35);
    position:relative;
  }

  .tagline{
    margin-top:10px;
    margin-bottom:34px;
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .tagline .dot{color:var(--gold);margin:0 6px;}

  .status{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--orange);
    margin-bottom:16px;
    padding:6px 14px;
    border:1px solid rgba(255,107,0,0.35);
    border-radius:20px;
    background:rgba(255,107,0,0.06);
  }
  .status .pulse{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px var(--gold);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:0.4;transform:scale(0.7);}
  }

  .login-link{
    position:fixed;
    top:16px;
    right:16px;
    z-index:50;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    font-size:12.5px;
    font-weight:700;
    color:var(--gold);
    text-decoration:none;
    letter-spacing:0.3px;
    border:1px solid rgba(255,199,0,0.4);
    border-radius:20px;
    background:rgba(13,4,2,0.6);
    backdrop-filter:blur(4px);
  }
  .login-link:hover{ border-color:var(--gold); background:rgba(255,199,0,0.1); }
  .login-avatar{
    width:20px;
    height:20px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--gold);
  }

  .donate-fixed{
    position:fixed;
    bottom:16px;
    right:16px;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:8px 12px;
    border:1px solid rgba(255,199,0,0.4);
    border-radius:16px;
    background:rgba(13,4,2,0.6);
    backdrop-filter:blur(4px);
  }
  .donate-fixed-label{
    font-family:'Orbitron',sans-serif;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .donate-fixed #donate-button-container{
    line-height:0;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 20px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px;
    text-decoration:none;
    color:#fff;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:16.5px;
    letter-spacing:0.5px;
    overflow:hidden;
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
    text-align:left;
  }
  .link-btn::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .18s ease;
    z-index:0;
  }
  .link-btn:hover{
    transform:translateY(-3px) scale(1.015);
  }
  .link-btn:active{transform:translateY(-1px) scale(0.99);}
  .link-btn:hover::before{opacity:1;}
  .link-btn span, .link-btn .ic{position:relative;z-index:1;}
  .ic{
    width:26px;height:26px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .arrow{
    margin-left:auto;
    opacity:0.5;
    font-family:'Orbitron',sans-serif;
    font-size:14px;
    position:relative;z-index:1;
  }

  .link-btn.instagram{border-color:rgba(255,30,86,0.3);}
  .link-btn.instagram::before{background:linear-gradient(90deg, rgba(255,30,86,0.16), rgba(255,199,0,0.08));}
  .link-btn.instagram:hover{border-color:var(--ember);}

  .link-btn.facebook{border-color:rgba(255,107,0,0.3);}
  .link-btn.facebook::before{background:linear-gradient(90deg, rgba(255,107,0,0.16), rgba(255,61,26,0.08));}
  .link-btn.facebook:hover{border-color:var(--orange);}

  .link-btn.tiktok{border-color:rgba(255,199,0,0.3);}
  .link-btn.tiktok::before{background:linear-gradient(90deg, rgba(255,199,0,0.14), rgba(255,107,0,0.08));}
  .link-btn.tiktok:hover{border-color:var(--gold);}

  .link-btn.youtube{border-color:rgba(255,61,26,0.3);}
  .link-btn.youtube::before{background:linear-gradient(90deg, rgba(255,61,26,0.16), rgba(255,30,86,0.08));}
  .link-btn.youtube:hover{border-color:var(--red);}

  .link-btn.discord{border-color:rgba(88,101,242,0.35);}
  .link-btn.discord::before{background:linear-gradient(90deg, rgba(88,101,242,0.18), rgba(255,107,0,0.06));}
  .link-btn.discord:hover{border-color:#5865F2;}

  .link-btn.telegram{border-color:rgba(38,165,228,0.35);}
  .link-btn.telegram::before{background:linear-gradient(90deg, rgba(38,165,228,0.18), rgba(255,199,0,0.06));}
  .link-btn.telegram:hover{border-color:#26A5E4;}

  .link-btn.whatsapp{border-color:rgba(37,211,102,0.35);}
  .link-btn.whatsapp::before{background:linear-gradient(90deg, rgba(37,211,102,0.18), rgba(255,107,0,0.06));}
  .link-btn.whatsapp:hover{border-color:#25D366;}

  footer{
    margin-top:36px;
    font-size:11px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:rgba(201,168,150,0.5);
    font-family:'Orbitron',sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    .badge, .badge-inner, .status .pulse, .badge::before, .badge::after{animation:none;}
  }
</style>
</head>

  <script>
    (function(){
      var canvas = document.getElementById('embers');
      var ctx = canvas.getContext('2d');
      var W, H, particles, bursts;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var colors = ['255,107,0', '255,61,26', '255,199,0', '255,30,86'];

      function resize(){
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function makeParticle(spawnAtBottom){
        var size = Math.random() * 2.6 + 0.8;
        return {
          x: Math.random() * W,
          y: spawnAtBottom ? H + Math.random() * H * 0.3 : Math.random() * H,
          size: size,
          speedY: Math.random() * 0.55 + 0.18,
          drift: (Math.random() - 0.5) * 0.5,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: Math.random() * 0.02 + 0.006,
          color: colors[Math.floor(Math.random() * colors.length)],
          baseAlpha: Math.random() * 0.5 + 0.25
        };
      }

      function init(){
        resize();
        var count = W < 600 ? 34 : 60;
        particles = [];
        bursts = [];
        for(var i = 0; i < count; i++){
          particles.push(makeParticle(false));
        }
      }

      function spawnBurst(x, y){
        var count = W < 600 ? 16 : 24;
        for(var i = 0; i < count; i++){
          var angle = Math.random() * Math.PI * 2;
          var speed = Math.random() * 3.2 + 1;
          bursts.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 3 + 1.5,
            life: 1,
            decay: Math.random() * 0.02 + 0.018,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      function tick(){
        ctx.clearRect(0, 0, W, H);

        for(var i = 0; i < particles.length; i++){
          var p = particles[i];
          p.wobble += p.wobbleSpeed;
          p.x += p.drift + Math.sin(p.wobble) * 0.35;
          p.y -= p.speedY;

          if(p.y < -10){
            particles[i] = makeParticle(true);
            continue;
          }

          var flicker = (Math.sin(p.wobble * 2.3) + 1) / 2;
          var alpha = p.baseAlpha * (0.6 + flicker * 0.4);

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + p.color + ',' + alpha.toFixed(3) + ')';
          ctx.shadowBlur = p.size * 4;
          ctx.shadowColor = 'rgba(' + p.color + ',' + (alpha * 0.8).toFixed(3) + ')';
          ctx.fill();
        }

        for(var j = bursts.length - 1; j >= 0; j--){
          var b = bursts[j];
          b.x += b.vx;
          b.y += b.vy;
          b.vx *= 0.96;
          b.vy = b.vy * 0.96 + 0.04;
          b.life -= b.decay;

          if(b.life <= 0){
            bursts.splice(j, 1);
            continue;
          }

          var bSize = b.size * b.life;
          ctx.beginPath();
          ctx.arc(b.x, b.y, bSize, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + b.color + ',' + b.life.toFixed(3) + ')';
          ctx.shadowBlur = bSize * 5;
          ctx.shadowColor = 'rgba(' + b.color + ',' + b.life.toFixed(3) + ')';
          ctx.fill();
        }

        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('pointerdown', function(e){
        spawnBurst(e.clientX, e.clientY);
      }, { passive: true });

      init();

      if(!reduceMotion){
        requestAnimationFrame(tick);
      } else {
        tick();
      }
    })();
  </script>

  <script>
    (function(){
      var cursor = document.getElementById('customCursor');
      var isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
      if(!isFinePointer) return; // leave touch devices with their normal behavior

      document.documentElement.classList.add('has-custom-cursor');
      var shown = false;

      window.addEventListener('pointermove', function(e){
        if(e.pointerType && e.pointerType !== 'mouse') return;
        if(!shown){ cursor.style.opacity = '1'; shown = true; }
        cursor.style.transform = 'translate(' + (e.clientX - 2) + 'px,' + (e.clientY - 2) + 'px)';
      }, { passive: true });

      document.addEventListener('mouseleave', function(){ cursor.style.opacity = '0'; });
      document.addEventListener('mouseenter', function(){ if(shown) cursor.style.opacity = '1'; });
    })();
  </script>

  <script>
    (function(){
      var hasFirebase = (typeof firebaseConfig !== 'undefined') &&
        firebaseConfig.databaseURL &&
        firebaseConfig.databaseURL.indexOf('YOUR_PROJECT') === -1;

      if (!hasFirebase || typeof firebase === 'undefined') return;

      try {
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(function(user){
          var link = document.getElementById('loginLink');
          var avatar = document.getElementById('loginAvatar');
          var text = document.getElementById('loginText');
          if (!link || !avatar || !text) return;

          if (user) {
            var name = user.displayName || (user.email ? user.email.split('@')[0] : 'Player');
            text.textContent = name;
            if (user.photoURL) {
              avatar.src = user.photoURL;
              avatar.classList.remove('hidden');
            } else {
              avatar.classList.add('hidden');
              text.textContent = '👋 ' + name;
            }
          } else {
            avatar.classList.add('hidden');
            text.textContent = '👤 Login / Sign Up';
          }
        });
      } catch (e) { /* leave default login link on any error */ }
    })();
  </script>

</body>
</html>
